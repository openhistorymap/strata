[project]
name = "strata"
version = "0.2.0"
description = "An archaeological excavation as one Relate graph file: stratigraphy, finds, periods and places, connected."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "relate-db>=1.2,<2",
    "harris-mcp @ git+https://github.com/openhistorymap/harris-mcp.git",
    "fastmcp>=3,<4",
    "httpx>=0.27",
]

[project.scripts]
strata = "strata.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["strata"]

[tool.pytest.ini_options]
testpaths = ["tests"]

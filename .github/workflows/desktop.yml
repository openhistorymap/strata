name: Claude Desktop extension

# Builds strata.mcpb (an MCP Bundle) from the repository and, for a version
# tag, attaches it to that tag's GitHub release. Any other run keeps it as a
# workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble the bundle
        run: uv run python desktop/build.py
      - name: Test the bundle's store handling
        run: uv run pytest -q tests/test_desktop.py
      - name: Validate and pack
        run: |
          npx -y @anthropic-ai/mcpb validate dist/strata-desktop/manifest.json
          npx -y @anthropic-ai/mcpb pack dist/strata-desktop dist/strata.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: strata.mcpb
          path: dist/strata.mcpb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Strata $GITHUB_REF_NAME" --notes-file desktop/RELEASE.md
          gh release upload "$GITHUB_REF_NAME" dist/strata.mcpb --clobber
